<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}DCA — 7-Day Spiritual Growth{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --royal: #3D1259;
  --royal-mid: #5C2D82;
  --royal-light: #7B48A6;
  --gold: #C9A84C;
  --gold-light: #E4CC7A;
  --gold-dim: rgba(201,168,76,0.15);
  --cream: #FDF6EC;
  --cream-dark: #F5EBDA;
  --ink: #1A0A2E;
  --ink-soft: #4A3B5C;
  --white: #FFFFFF;
  --success: #2E7D5B;
  --success-light: #E8F5EE;
  --error: #C62828;
  --error-light: #FFEBEE;
  --info-bg: #E3F2FD;
  --info-color: #1565C0;
  --radius: 16px;
  --radius-sm: 10px;
  --shadow-soft: 0 4px 24px rgba(61,18,89,0.08);
  --shadow-lift: 0 12px 40px rgba(61,18,89,0.12);
  --shadow-glow: 0 0 60px rgba(201,168,76,0.15);
}

html { scroll-behavior: smooth; }

body {
  font-family: 'Outfit', sans-serif;
  background: var(--cream);
  color: var(--ink);
  min-height: 100vh;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}

.serif { font-family: 'Cormorant Garamond', serif; }

a { color: var(--royal-mid); text-decoration: none; }
a:hover { text-decoration: underline; }

/* Flash messages */
.flash-container {
  position: fixed;
  top: 16px; left: 50%;
  transform: translateX(-50%);
  z-index: 9999;
  display: flex;
  flex-direction: column;
  gap: 8px;
  width: 90%;
  max-width: 480px;
}

.flash-msg {
  padding: 14px 20px;
  border-radius: var(--radius-sm);
  font-size: 0.9rem;
  font-weight: 400;
  animation: flashIn 0.4s ease-out;
  position: relative;
}

.flash-msg.success { background: var(--success-light); color: var(--success); border: 1px solid rgba(46,125,91,0.2); }
.flash-msg.error { background: var(--error-light); color: var(--error); border: 1px solid rgba(198,40,40,0.2); }
.flash-msg.info { background: var(--info-bg); color: var(--info-color); border: 1px solid rgba(21,101,192,0.2); }

.flash-close {
  position: absolute;
  top: 50%; right: 12px;
  transform: translateY(-50%);
  background: none; border: none;
  font-size: 1.1rem; cursor: pointer;
  color: inherit; opacity: 0.5;
}

@keyframes flashIn {
  from { opacity: 0; transform: translateY(-10px); }
  to { opacity: 1; transform: translateY(0); }
}

@keyframes fadeDown {
  from { opacity: 0; transform: translateY(-16px); }
  to { opacity: 1; transform: translateY(0); }
}

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

@keyframes cardIn {
  from { opacity: 0; transform: translateY(30px) scale(0.97); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

@keyframes scaleIn {
  from { opacity: 0; transform: scale(0.5); }
  to { opacity: 1; transform: scale(1); }
}

@keyframes confettiFall {
  0% { transform: translateY(0) rotate(0deg); opacity: 1; }
  100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
}

/* Shared button styles */
.btn-primary {
  display: inline-block;
  padding: 16px 32px;
  background: linear-gradient(135deg, var(--gold) 0%, #B8923E 100%);
  border: none;
  border-radius: var(--radius-sm);
  color: var(--ink);
  font-family: 'Outfit', sans-serif;
  font-size: 0.95rem;
  font-weight: 600;
  letter-spacing: 0.04em;
  cursor: pointer;
  transition: all 0.35s ease;
  text-align: center;
}

.btn-primary:hover { transform: translateY(-2px); box-shadow: var(--shadow-glow); text-decoration: none; }

/* Shared input styles */
.input-group { position: relative; }

.input-group label {
  display: block;
  font-size: 0.7rem;
  font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  margin-bottom: 6px;
}

.input-group input {
  width: 100%;
  padding: 14px 16px;
  border: 1px solid rgba(0,0,0,0.1);
  border-radius: var(--radius-sm);
  font-family: 'Outfit', sans-serif;
  font-size: 0.95rem;
  font-weight: 300;
  transition: all 0.3s ease;
  outline: none;
  background: var(--white);
  color: var(--ink);
}

.input-group input:focus {
  border-color: var(--gold);
  box-shadow: 0 0 0 3px var(--gold-dim);
}

/* SVG defs */
svg.defs-only { position: absolute; width: 0; height: 0; }

/* Confetti container */
.confetti-container {
  position: fixed; inset: 0;
  pointer-events: none; z-index: 9999;
}

.confetti-piece {
  position: absolute;
  width: 8px; height: 8px;
  top: -10px;
  animation: confettiFall 3s cubic-bezier(0.25, 0, 0.35, 1) forwards;
}

{% block extra_css %}{% endblock %}
</style>
</head>
<body>

<svg class="defs-only">
  <defs>
    <linearGradient id="progressGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C9A84C"/>
      <stop offset="100%" stop-color="#5C2D82"/>
    </linearGradient>
  </defs>
</svg>

{% with messages = get_flashed_messages(with_categories=true) %}
  {% if messages %}
  <div class="flash-container">
    {% for category, message in messages %}
    <div class="flash-msg {{ category }}">
      {{ message }}
      <button class="flash-close" onclick="this.parentElement.remove()">&times;</button>
    </div>
    {% endfor %}
  </div>
  <script>setTimeout(()=>{document.querySelectorAll('.flash-msg').forEach(m=>m.style.display='none')},5000);</script>
  {% endif %}
{% endwith %}

<div class="confetti-container" id="confettiContainer"></div>

{% block content %}{% endblock %}

<script>
function spawnConfetti() {
  const container = document.getElementById('confettiContainer');
  const colors = ['#C9A84C','#E4CC7A','#5C2D82','#7B48A6','#3D1259','#FFFFFF','#2E7D5B'];
  for (let i = 0; i < 60; i++) {
    const p = document.createElement('div');
    p.className = 'confetti-piece';
    p.style.left = Math.random()*100+'%';
    p.style.background = colors[Math.floor(Math.random()*colors.length)];
    p.style.width = (4+Math.random()*8)+'px';
    p.style.height = (4+Math.random()*8)+'px';
    p.style.borderRadius = Math.random()>0.5?'50%':'2px';
    p.style.animationDelay = (Math.random()*1.2)+'s';
    p.style.animationDuration = (2+Math.random()*2)+'s';
    container.appendChild(p);
  }
  setTimeout(()=>{container.innerHTML='';},4500);
}
</script>

{% block scripts %}{% endblock %}
</body>
</html>
